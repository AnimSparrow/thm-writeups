<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" aria-label="AI &amp; Automation in Detection Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0633"/><stop offset="100%" stop-color="#3a0a5e"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A6D" stop-opacity="0"/><stop offset="50%" stop-color="#FF2A6D" stop-opacity="0.6"/><stop offset="100%" stop-color="#FF2A6D" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,'SF Mono',Menlo,'Cascadia Code',Consolas,monospace}</style>

  <rect x="0.5" y="0.5" width="899" height="169" rx="14" fill="url(#bg)" stroke="#FF2A6D" stroke-opacity="0.30"/>
  <path d="M 16,1 L 84,1 L 16,69 Z" fill="#FF2A6D" opacity="0.10"/>
  <path d="M 884,169 L 816,169 L 884,101 Z" fill="#00F0FF" opacity="0.08"/>

  <!-- platform pill -->
  <g transform="translate(36,26)">
    <rect x="0" y="0" width="112" height="20" rx="5" fill="#FF2A6D" fill-opacity="0.12" stroke="#FF2A6D" stroke-opacity="0.5"/>
    <text x="56" y="14" fill="#FF2A6D" font-size="11" font-weight="700" letter-spacing="2.5" text-anchor="middle">TRYHACKME</text>
  </g>
  <!-- blue-team pill -->
  <g transform="translate(158,26)">
    <rect x="0" y="0" width="118" height="20" rx="5" fill="#00F0FF" fill-opacity="0.10" stroke="#00F0FF" stroke-opacity="0.45"/>
    <text x="59" y="14" fill="#00F0FF" font-size="11" font-weight="700" letter-spacing="2.2" text-anchor="middle">BLUE TEAM</text>
  </g>

  <!-- title (two lines to keep it big) -->
  <text x="36" y="96" fill="url(#hero)" font-size="34" font-weight="700" filter="url(#glow)">AI &amp; Automation in</text>
  <text x="36" y="132" fill="url(#hero)" font-size="34" font-weight="700" filter="url(#glow)">Detection Engineering</text>

  <!-- meta line -->
  <text x="38" y="154" fill="#A479C4" font-size="12" font-weight="600" letter-spacing="1.2">DETECTION-AS-CODE  ·  SIGMA  ·  AGENTIC AI  ·  2026</text>

  <rect x="560" y="147" width="304" height="1" fill="url(#rule)"/>
</svg>
